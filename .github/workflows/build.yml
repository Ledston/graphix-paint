name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Engine tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: build\gx_tests.exe

      - name: UI scenario tests (warp, layers, line art, settings, recording)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $out = & build\gx_uiscenarios.exe 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $out | Write-Output
          # failures as annotations, so they can be read without the full log
          $scenario = ""
          foreach ($line in $out) {
            if ($line -like "== *") { $scenario = $line }
            elseif ($line -like "FAIL*" -or $line -like "NOTE*") { Write-Output "::error::$scenario $line" }
          }
          exit $code

      - name: UI smoke test (every tool and menu command)
        env:
          QT_QPA_PLATFORM: offscreen
        run: build\gx_uismoke.exe uismoke

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "dist\GraphiX Paint"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item build\GraphiX.exe $dist\
          windeployqt --release --translations ru,en --no-system-d3d-compiler --no-opengl-sw --no-compiler-runtime "$dist\GraphiX.exe"
          # MSVC runtime next to the program, so it starts on a clean Windows without installers
          $redist = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          if (-not $redist) { throw "MSVC runtime not found in $env:VCToolsRedistDir" }
          Copy-Item "$($redist.FullName)\*.dll" $dist\
          if (-not (Test-Path "$dist\vcruntime140.dll")) { throw "vcruntime140.dll missing" }
          if (-not (Test-Path "$dist\platforms\qwindows.dll")) { throw "Qt platform plugin missing" }
          if (-not (Test-Path "$dist\imageformats\qwebp.dll")) { throw "WebP plugin missing" }
          if (-not (Test-Path "$dist\translations\qtbase_ru.qm")) { Write-Warning "Qt Russian translation missing (OK / Cancel stay in English)" }
          Get-ChildItem -Recurse $dist | Select-Object -ExpandProperty FullName
          Copy-Item README.md "$dist\README.md"
          Compress-Archive -Path "dist\GraphiX Paint" -DestinationPath GraphiX-Paint-win64.zip -Force

      - name: Test the packaged program (without the Qt SDK on PATH)
        shell: pwsh
        timeout-minutes: 8
        run: |
          Copy-Item -Recurse "dist\GraphiX Paint" dist-test
          Copy-Item build\gx_uismoke.exe dist-test\
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          $env:PATH = "C:\Windows\system32;C:\Windows;C:\Windows\System32\WindowsPowerShell\v1.0"
          $p = Start-Process -FilePath "dist-test\gx_uismoke.exe" -ArgumentList "uismoke-packaged" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "packaged program test failed: $($p.ExitCode)" }
          if (-not (Test-Path "uismoke-packaged\final.png")) { throw "no screenshot from the packaged program" }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: GraphiX-Paint-win64
          path: GraphiX-Paint-win64.zip

      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: |
            uismoke
            uismoke-packaged
          if-no-files-found: ignore

      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('GraphiX Paint 1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: GraphiX-Paint-win64.zip
          make_latest: true
          generate_release_notes: true
          body: |
            Download **GraphiX-Paint-win64.zip**, unpack it anywhere and run `GraphiX.exe`. No installation needed.
            Скачайте **GraphiX-Paint-win64.zip**, распакуйте в любую папку и запустите `GraphiX.exe`. Установка не нужна.
