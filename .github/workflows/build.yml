name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Engine tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: build\gx_tests.exe

      - name: UI smoke test (every tool and menu command)
        env:
          QT_QPA_PLATFORM: offscreen
        run: build\gx_uismoke.exe uismoke

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist\GraphiX Paint"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item build\GraphiX.exe $dist\
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw --no-compiler-runtime "$dist\GraphiX.exe"
          # MSVC runtime next to the program, so it starts on a clean Windows without installers
          $redist = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          Copy-Item "$($redist.FullName)\*.dll" $dist\
          Copy-Item README.md "$dist\README.md"
          Compress-Archive -Path "dist\GraphiX Paint" -DestinationPath GraphiX-Paint-win64.zip -Force

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: GraphiX-Paint-win64
          path: GraphiX-Paint-win64.zip

      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: uismoke
          if-no-files-found: ignore

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GraphiX-Paint-win64.zip
          make_latest: true
          generate_release_notes: true
